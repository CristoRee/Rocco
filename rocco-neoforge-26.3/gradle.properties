# Memoria para Gradle (NeoForge descompila Minecraft la primera vez).
#
# Las dos propiedades jdk.tls / https.protocols son un parche para esta maquina: las descargas
# HTTPS grandes se corrompen por el camino de TLS 1.3. Forzando TLS 1.2 llegan completas.
# Si cambias de red o se arregla el antivirus que lo causa, se pueden borrar sin problema.
org.gradle.jvmargs=-Xmx3G -Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2
org.gradle.daemon=false
# Java 25 tiene que estar instalado: Gradle no se baja uno solo.
org.gradle.java.installations.auto-download=false

## Minecraft y NeoForge
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.103
neo_version_range=[26.3.0.0,)
loader_version_range=[4,)

