plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    // Para meter adentro del jar el reproductor de musica (lavaplayer) con sus paquetes renombrados.
    id 'com.gradleup.shadow' version '8.3.5'
}

version = mod_version
group = mod_group_id

// Nombre del jar como lo esperan CurseForge y los launchers: rocco-neoforge-1.21.1-1.6.0.jar
base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// Minecraft 1.21.1 viene con Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

configurations {
    shade
    implementation.extendsFrom shade
    // -Pprodtest: el mod se carga desde un jar en run/mods, armado con "shadowJar".
    // Asi se prueba lo que le llega a la gente. Con runClient comun la musica no anda: lavaplayer
    // queda repartido en varios modulos y no encuentra sus decodificadores; en el jar final van juntos.
}
if (!project.hasProperty('prodtest')) {
    configurations.matching { it.name == 'additionalRuntimeClasspath' }.configureEach { extendsFrom configurations.shade }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    if (!project.hasProperty('prodtest')) {
        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

dependencies {
    // GeckoLib: motor de animaciones/modelos para la entidad de Rocco
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Musica desde links (archivos de audio y radios): lavaplayer abre el link y decodifica.
    // Va adentro del jar (shade). Lo que Minecraft ya trae (httpclient, commons-io,
    // commons-codec, slf4j) no se repite: se usa el del juego.
    shade("dev.arbjerg:lavaplayer:${lavaplayer_version}") { excludeProvidedByMinecraft(delegate) }
}

def excludeProvidedByMinecraft(dep)
{
    dep.exclude group: 'org.apache.httpcomponents'
    dep.exclude group: 'commons-io'
    dep.exclude group: 'commons-codec'
    dep.exclude group: 'commons-logging'
    dep.exclude group: 'org.slf4j'
    dep.exclude group: 'org.jetbrains', module: 'annotations'
    // Rhino (JavaScript) solo lo usa la fuente de YouTube de lavaplayer, que no se usa.
    dep.exclude group: 'org.mozilla'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            geckolib_version       : geckolib_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    // Minecraft solo usa el castellano de España (es_es) si el juego esta en ese idioma: en
    // castellano rioplatense, mexicano, chileno... cae al ingles. Los mismos textos se copian
    // a cada variante (y el portugues de Brasil al de Portugal) al armar el mod.
    doLast {
        def lang = new File(destinationDir, 'assets/rocco/lang')
        // Lo que le falta a un idioma, Minecraft lo saca de en_us: un texto sin su linea en castellano
        // se veria en ingles. Las ayudas de la config (rocco.tip) salen de los comentarios del config.
        def english = new groovy.json.JsonSlurper().parse(new File(lang, 'en_us.json'), 'UTF-8') as Map
        def spanish = new groovy.json.JsonSlurper().parse(new File(lang, 'es_es.json'), 'UTF-8') as Map
        def missing = english.keySet().findAll { !spanish.containsKey(it) && !it.startsWith('rocco.tip.') }
        if (!missing.isEmpty()) {
            throw new GradleException('Textos sin castellano en es_es.json: ' + missing.take(10))
        }
        ['es_ar', 'es_cl', 'es_ec', 'es_mx', 'es_uy', 'es_ve'].each { code ->
            new File(lang, code + '.json').bytes = new File(lang, 'es_es.json').bytes
        }
        new File(lang, 'pt_pt.json').bytes = new File(lang, 'pt_br.json').bytes
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    // El jar sin las librerias queda aparte; el que se publica es el de shadowJar.
    archiveClassifier = 'slim'
}

// El jar que se publica: el mod mas lavaplayer adentro. Las librerias comunes se renombran para
// no chocar con otros mods. lavaplayer queda con sus paquetes: sus decodificadores nativos (Opus,
// MP3, AAC) se enganchan por el nombre de la clase. De los nativos van Windows, Linux y Mac.
tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    configurations = [project.configurations.shade]
    archiveClassifier = ''
    manifest.inheritFrom tasks.jar.manifest
    relocate 'com.fasterxml.jackson', 'com.cristoree.rocco.lib.jackson'
    relocate 'org.jsoup', 'com.cristoree.rocco.lib.jsoup'
    relocate 'org.json', 'com.cristoree.rocco.lib.json'
    relocate 'net.iharder', 'com.cristoree.rocco.lib.iharder'
    mergeServiceFiles()
    exclude 'natives/linux-x86/**', 'natives/linux-arm/**', 'natives/linux-armhf/**', 'natives/linux-aarch32/**',
            'natives/linux-musl-*/**', 'natives/win-x86/**'
    exclude 'META-INF/versions/**/module-info.class', 'module-info.class', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    // Solo se usa el link directo: las fuentes que sacan audio de sitios ni viajan en el jar.
    ['bandcamp', 'beam', 'getyarn', 'local', 'nico', 'soundcloud', 'twitch', 'vimeo', 'yamusic', 'youtube'].each {
        exclude "com/sedmelluq/discord/lavaplayer/source/${it}/**"
    }
    exclude 'com/sedmelluq/discord/lavaplayer/source/AudioSourceManagers*'
}

tasks.named('assemble') { dependsOn 'shadowJar' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
